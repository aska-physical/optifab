# Read by bar/check.py in Proven-Commons/mission.
# See playbook/verified-bar.md there for what each field means.

[project]
name = "plantgate"
# "in-progress" until every bar item passes, then "verified".
status = "in-progress"
# The public project page.
page = "README.md"
# Everyone who wrote the specification. It was written by an AI agent
# working for the owner of aska-physical; no person wrote it.
spec_authors = ["claude-for-abu-aska"]
# The programs people run. The reviewer checks that they call the proved
# functions, so a change to them voids the approval.
entry_points = ["Main.lean"]

[spec]
# What a reviewer approves, together with the whole page named above.
# PlantGate/Spec.lean is the challenge module named in comparator.json.
files = ["SPEC.md", "PlantGate/Spec.lean"]
# The code under proof: the definitions the statements are about.
code = [
  "PlantGate.distSq",
  "PlantGate.headroom",
  "PlantGate.Verdict",
  "PlantGate.Verdict.ok",
  "PlantGate.Outcome",
