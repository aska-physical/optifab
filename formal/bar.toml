# No approval is recorded. The Proven Commons reviewer list is empty, so
# none can be yet.

[tests]
results = "tests/TEST-RESULTS.md"
command = "python3 tests/run_tests.py"
# The test generator and the oracle. A change to either voids the approval.
files = ["tests/run_tests.py", "tests/oracle.py"]
