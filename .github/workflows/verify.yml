name: verify

# Reruns the verifier and fails if the committed certificate differs.
# A green run shows that the certificate follows from the pinned inputs.
# It does not show that the upstream models describe a real building.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The certificate must not depend on the interpreter. Python 3.12 changed how sum() rounds floats,
        # and a count in the certificate once followed it, so versions on both sides of 3.12 are checked.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install sympy==1.14.0
      - run: python3 verify.py
      - name: Run pure-Q Phase P0 + L0 regression and mutation suite
        run: |
          python3 -I -B tests/test_optifab_v04_p0_q_core.py
          python3 -I -O -B tests/test_optifab_v04_p0_q_core.py
          python3 -I -B -W error tests/test_optifab_v04_p0_q_core.py
      - name: The generated documents are up to date
        run: |
          python3 tools/render_map.py
          git diff --exit-code -- docs
